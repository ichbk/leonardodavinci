<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picturi</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #434343;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            padding: 40px 20px;
        }
        .coloana-lunga {
            max-width: 700px;
            margin: 0 auto;
            background-color: #333333;
            padding: 40px;
            border-radius: 10px;
            border: 2px solid #666;
        }

        .titlu-pagina {
            text-align: center;
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 40px;
            border-bottom: 2px solid #666;
            padding-bottom: 15px;
        }
        .bloc-continut {
            margin-bottom: 50px;
        }

        .poza-sectiune {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #777;
            background-color: #222;
            display: block;
            margin-bottom: 20px;
        }

        .text-sectiune {
            font-size: 19px;
            line-height: 1.7;
            color: #e0e0e0;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="coloana-lunga">
        <h1 class="titlu-pagina">Picturile lui Leonardo da Vinci</h1>

        <div class="bloc-continut">
            <img src="poza1-a.jpg" alt="Prima imagine" class="poza-sectiune">
            <p class="text-sectiune">
               1
            </p>
        </div>

        <div class="bloc-continut">
            <img src="poza1-b.jpg" alt="A doua imagine" class="poza-sectiune">
            <p class="text-sectiune">
                2
            </p>
        </div>

        <div class="bloc-continut">
            <img src="poza1-c.jpg" alt="A treia imagine" class="poza-sectiune">
            <p class="text-sectiune">
                3
            </p>
        </div>

    </div>

</body>
</html>
